[project]
name = "realtime-market-data-pipeline"
version = "0.2.0"
description = "Real-time market data pipeline: Kafka -> Flink -> ClickHouse/Iceberg -> API"
requires-python = ">=3.13"

[tool.uv.workspace]
members = ["libs/*", "services/*"]

[tool.uv.sources]
mdp-core = { workspace = true }

[dependency-groups]
dev = [
    "testcontainers>=4.9",
    "dbt-core>=1.9",
    "dbt-clickhouse>=1.9",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/gen/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
exclude = [".*/gen/.*"]

[[tool.mypy.overrides]]
module = ["confluent_kafka.*", "clickhouse_connect.*", "vaderSentiment.*", "anthropic.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# `tests/` holds integration tests that need Docker; they are opt-in via
# `-m integration` so the default run stays fast and hermetic.
testpaths = ["libs", "services"]
markers = [
    "integration: needs Docker (testcontainers). Run with: pytest tests/ -m integration",
]
