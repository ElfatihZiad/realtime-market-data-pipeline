name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages

      # No code generation step: the Avro schemas in contracts/ are read at
      # runtime by the producer and resolved from the schema registry by Flink
      # and ClickHouse. See docs/adr/0008-avro-and-schema-registry-over-protobuf.md.

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy libs services

      - name: Test
        run: uv run pytest -q

  # Phase 4 adds a second job here: integration tests against real Kafka and
  # ClickHouse via testcontainers.
