# Local development stack. One command, no README archaeology:
#   just up      (or: docker compose up -d --wait)
#
# Kafka runs in KRaft mode. There is no ZooKeeper here and there cannot be:
# Kafka 4.0 removed it entirely.

name: mdp

services:
  kafka:
    image: apache/kafka:4.3.2
    container_name: mdp-kafka
    ports:
      - "19092:19092"   # host -> broker (EXTERNAL listener)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 24
      # Without this the broker writes its log to the image's default path and
      # the kafka-data volume below is mounted but never used — so every
      # `docker compose down` silently discarded the topics.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: mdp-local-cluster-0001
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    volumes:
      - kafka-data:/var/lib/kafka/data

  # Creates the topics, then exits. Keyed by instrument_id, so per-instrument
  # ordering holds across partitions.
  kafka-init:
    image: apache/kafka:4.3.2
    container_name: mdp-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for t in ticks.raw ticks.dlq ticks.late bars.1m bars.5m signals.1m; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic "$$t" --partitions 3 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:26.9
    container_name: mdp-clickhouse
    ports:
      - "8123:8123"   # HTTP  (http://localhost:8123/play)
      - "9000:9000"   # native
    depends_on:
      schema-registry:
        condition: service_healthy
    environment:
      CLICKHOUSE_DB: market
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./infra/clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # Holds the Avro schemas. Once a contract is registered here, an
  # incompatible change to it is rejected rather than silently shipped.
  schema-registry:
    image: confluentinc/cp-schema-registry:8.2.4
    container_name: mdp-schema-registry
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "18081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/subjects >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  # S3-compatible object storage for the Iceberg warehouse.
  #
  # Not MinIO: it no longer publishes publicly pullable images. s3mock is a
  # small S3 server that is enough to exercise the real path — Iceberg writes
  # through S3FileIO (the AWS SDK), not through Hadoop's local filesystem,
  # which is what production looks like. Swapping to real S3 is a change of
  # endpoint and credentials.
  s3mock:
    image: adobe/s3mock:5.2.3
    container_name: mdp-s3mock
    ports:
      # 9091 on the host: 9090 is Prometheus's conventional port and it wins.
      # Everything inside the network still talks to s3mock:9090.
      - "9091:9090"
    environment:
      retainFilesOnExit: "true"
      root: /data
    volumes:
      - iceberg-warehouse:/data
    healthcheck:
      # The image ships wget, not curl. "/" lists buckets, which is enough
      # to know the server is up.
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9090/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 15s

  # Creates the warehouse bucket. s3mock's own `initialBuckets` setting did
  # not take, and Iceberg will not create a bucket for you — it expects one to
  # exist, exactly as real S3 does.
  s3mock-init:
    image: curlimages/curl:8.17.0
    container_name: mdp-s3mock-init
    depends_on:
      s3mock:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    # Idempotent: creating a bucket that already exists returns 409, which is
    # success for our purposes.
    command:
      - |
        code=$$(curl -sS -o /dev/null -w '%{http_code}' -X PUT http://s3mock:9090/warehouse)
        echo "PUT /warehouse -> $$code"
        [ "$$code" = "200" ] || [ "$$code" = "409" ]
    restart: "no"

  # Iceberg REST catalog. The warehouse is a shared volume rather than object
  # storage: MinIO no longer publishes publicly pullable images, so there is no
  # S3 emulator to point at here. Swapping to S3FileIO in cloud is a change of
  # CATALOG_* env vars plus the iceberg-aws-bundle jar — see
  # docs/adr/0012-iceberg-rest-catalog-filesystem-warehouse.md.
  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.10.1
    container_name: mdp-iceberg-rest
    ports:
      - "8181:8181"
    depends_on:
      s3mock-init:
        condition: service_completed_successfully
    environment:
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://s3mock:9090
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
      CATALOG_URI: jdbc:sqlite:file:/catalog/catalog.db
      CATALOG_JDBC_SCHEMA__VERSION: V1
      AWS_ACCESS_KEY_ID: mdp
      AWS_SECRET_ACCESS_KEY: mdp-secret
      AWS_REGION: us-east-1
    user: root
    volumes:
      - iceberg-catalog:/catalog
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:8181/v1/config?warehouse=s3://warehouse/' >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  flink-jobmanager:
    build: ./infra/flink
    image: mdp-flink:2.1.3
    container_name: mdp-flink-jobmanager
    command: jobmanager
    depends_on:
      schema-registry:
        condition: service_healthy
      iceberg-rest:
        condition: service_healthy
    ports:
      - "8081:8081"   # Flink web UI
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.address: 0.0.0.0
        rest.bind-address: 0.0.0.0
        execution.checkpointing.interval: 10s
        state.backend.type: hashmap
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    volumes:
      - ./stream/sql:/opt/sql:ro
      - flink-checkpoints:/tmp/flink-checkpoints
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/overview >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  flink-taskmanager:
    # No `build:` here on purpose. Both Flink services run the same image, and
    # declaring the build twice makes Compose build the same tag concurrently,
    # which races and fails with "image already exists". The jobmanager builds
    # it; this one reuses it.
    image: mdp-flink:2.1.3
    container_name: mdp-flink-taskmanager
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    volumes:
      - ./stream/sql:/opt/sql:ro
      - flink-checkpoints:/tmp/flink-checkpoints

  # Airflow 3, for BATCH ONLY. The streaming jobs are long-running services
  # and are deliberately not modelled as DAG tasks — see
  # docs/adr/0004-airflow-for-batch-only.md.
  #
  # `standalone` runs the api-server, scheduler, dag-processor and triggerer in
  # one container against SQLite. That is a development topology, not a
  # production one; in cloud these are separate deployments on Postgres.
  airflow:
    build:
      context: .
      dockerfile: infra/airflow/Dockerfile
    image: mdp-airflow:3.3.2
    container_name: mdp-airflow
    command: standalone
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "8082:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__API_AUTH__JWT_SECRET: mdp-local-dev-secret
      AIRFLOW_HOME: /opt/airflow
      # The batch tasks reach the rest of the stack by service name.
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      ICEBERG_REST_URI: http://iceberg-rest:8181
      S3_ENDPOINT: http://s3mock:9090
      AWS_ACCESS_KEY_ID: mdp
      AWS_SECRET_ACCESS_KEY: mdp-secret
      AWS_REGION: us-east-1
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
      EDGAR_TICKERS: ${EDGAR_TICKERS:-AAPL,MSFT,GOOGL,AMZN,TSLA,META}
    volumes:
      - ./orchestration/dags:/opt/airflow/dags:ro
      - airflow-data:/opt/airflow
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v2/version >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  # ─────────────────────────── observability ───────────────────────────
  # Metrics say the pipeline is slow. Traces say which hop is slow. A pipeline
  # with five hops needs both.

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.11.0
    container_name: mdp-kafka-exporter
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9308:9308"

  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: mdp-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    extra_hosts:
      # The ingest service and API run on the host, not in compose.
      - "host.docker.internal:host-gateway"

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: mdp-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI
      - "4318:4318"     # OTLP/HTTP

  grafana:
    image: grafana/grafana:13.2.5
    container_name: mdp-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  kafka-data:
  clickhouse-data:
  flink-checkpoints:
  # These two are ONE unit of state. The catalog stores pointers to metadata
  # files in the warehouse; wiping either alone leaves the catalog referencing
  # objects that no longer exist and every Iceberg statement fails with
  # "Location does not exist". `just lake-reset` clears both together.
  iceberg-warehouse:
  iceberg-catalog:
  airflow-data:
  prometheus-data:
  grafana-data:
