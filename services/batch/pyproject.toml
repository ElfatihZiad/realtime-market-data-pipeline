[project]
name = "batch"
version = "0.3.0"
description = "Scheduled batch loads: SEC EDGAR fundamentals, FRED macro series"
requires-python = ">=3.13"
dependencies = [
    "mdp-core",
    "httpx>=0.28",
    "clickhouse-connect>=0.8",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/batch"]
