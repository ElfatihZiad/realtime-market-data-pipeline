[project]
name = "ingest-news"
version = "0.5.0"
description = "Crypto news RSS -> sentiment -> Kafka news.raw"
requires-python = ">=3.13"
dependencies = [
    "mdp-core[otel]",
    "httpx>=0.28",
    "confluent-kafka[avro,schemaregistry]>=2.6",
    "vaderSentiment>=3.3.2",
    "prometheus-client>=0.21",
    "structlog>=24.4",
]

[project.optional-dependencies]
claude = ["anthropic>=0.69"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest_news"]
