[project]
name = "api"
version = "0.2.0"
description = "Serving API: ClickHouse -> REST + WebSocket push"
requires-python = ">=3.13"
dependencies = [
    "mdp-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "clickhouse-connect>=0.8",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
