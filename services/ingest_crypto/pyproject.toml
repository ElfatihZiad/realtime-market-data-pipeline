[project]
name = "ingest-crypto"
version = "0.2.0"
description = "Coinbase trade feed -> Kafka ticks.raw"
requires-python = ">=3.13"
dependencies = [
    "mdp-core",
    "websockets>=14.1",
    "confluent-kafka>=2.6",
    "prometheus-client>=0.21",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest_crypto"]
