# Scrape config for the local stack.
#
# The targets here are the ones that answer the two questions that matter when
# a streaming pipeline misbehaves: how far behind are we (consumer lag), and
# how long is a trade taking to get from the venue to a query (end-to-end
# latency). Everything else is supporting detail.

global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The ingest service: ticks accepted, DLQ rejects, feed reconnects, and the
  # venue-to-us latency histogram.
  - job_name: ingest
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels: {service: ingest-crypto}

  # The serving API: request rate, latency, websocket connections.
  - job_name: api
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels: {service: api}

  # Consumer lag per group and partition. This is the single most important
  # number in the stack: it says whether processing is keeping up with ingest.
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]
        labels: {service: kafka}

  # Flink job and task metrics, via the Prometheus reporter enabled in
  # FLINK_PROPERTIES. Includes per-operator records in/out and backpressure.
  - job_name: flink
    static_configs:
      - targets: ["flink-jobmanager:9249", "flink-taskmanager:9249"]
        labels: {service: flink}
