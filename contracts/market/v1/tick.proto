syntax = "proto3";

package market.v1;

// A single executed trade, normalised across venues.
//
// This is the canonical contract for the raw ingest topic. Every venue adapter
// maps its own wire format onto this message, so nothing downstream needs to
// know that Coinbase and Binance disagree about field names.
//
// Timestamps are microseconds since the Unix epoch, UTC. Two of them, and the
// distinction matters:
//   event_time_us  - the venue's own clock: what the market did, and when.
//                    This is the field all windowing and watermarking uses.
//   ingest_time_us - our clock at the moment we received it.
// end-to-end latency == ingest_time_us - event_time_us, which is the single
// most useful number this pipeline produces about itself.
message Tick {
  // Canonical instrument id, e.g. "BTC-USD". Also the Kafka partition key, so
  // all ticks for one instrument keep their relative order.
  string instrument_id = 1;

  // Venue the trade happened on, e.g. "coinbase", "binance".
  string venue = 2;

  int64 event_time_us = 3;
  int64 ingest_time_us = 4;

  // Price and size are doubles here for simplicity. A production feed should
  // carry scaled integers or a decimal string: binary floating point cannot
  // represent a tick size of 0.01 exactly, and the error compounds through
  // VWAP and bar aggregation. See docs/adr/0007-price-as-double.md.
  double price = 5;
  double size = 6;

  // Aggressor side: "buy", "sell", or "" when the venue does not report it.
  string side = 7;

  // Venue-assigned trade/sequence id, used for de-duplication.
  string sequence = 8;
}
